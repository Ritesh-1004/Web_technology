<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>Student Registration</h1>
    <p class="subtitle">Fill in the details below. All fields are validated on the server.</p>

    {{BANNER}}

    <!-- novalidate: browser checks are turned off so the SERVER validation is always demonstrated -->
    <form action="/register" method="POST" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" value="{{NAME}}" placeholder="e.g. Ritesh Sharma">
        {{NAME_ERROR}}
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="text" id="email" name="email" value="{{EMAIL}}" placeholder="name@example.com">
        {{EMAIL_ERROR}}
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" name="mobile" value="{{MOBILE}}" placeholder="10-digit number">
        {{MOBILE_ERROR}}
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="text" id="age" name="age" value="{{AGE}}" placeholder="18 or above">
        {{AGE_ERROR}}
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters">
        {{PASSWORD_ERROR}}
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
        {{CONFIRM_ERROR}}
      </div>

      <div class="form-group">
        <label for="department">Department</label>
        <select id="department" name="department">
          <option value="">-- Select Department --</option>
          {{DEPARTMENT_OPTIONS}}
        </select>
        {{DEPARTMENT_ERROR}}
      </div>

      <button type="submit">Submit Registration</button>
    </form>
  </div>
</body>
</html>
